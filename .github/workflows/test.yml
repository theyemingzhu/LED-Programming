name: Tests

# One exact merged-source gate. Pull-request updates are proved locally instead
# of spending the shared Actions allowance on every intermediate commit. A
# repository-owned classifier selects bounded lanes. GitHub's workflow result
# already fails when any selected lane fails, so no runner-only aggregate job
# is needed.
on:
  merge_group:
  push:
    branches:
      - main
    paths:
      - 'lightweaver/**'
      - 'led-art-mapper/**'
      - 'packages/installer-core/**'
      - 'firmware/**'
      - 'release/**'
      - 'scripts/**'
      - 'docs/**'
      - 'TODO.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source: ${{ steps.lanes.outputs.source }}
      browser: ${{ steps.lanes.outputs.browser }}
      cloud: ${{ steps.lanes.outputs.cloud }}
      production: ${{ steps.lanes.outputs.production }}
      firmware: ${{ steps.lanes.outputs.firmware }}
      firmware_bundle_only: ${{ steps.lanes.outputs.firmware_bundle_only }}
      artifact: ${{ steps.lanes.outputs.artifact }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Select exact changed-path lanes
        id: lanes
        env:
          CI_ACTOR: ${{ github.actor }}
          CI_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          if [ "$CI_ACTOR" = "github-actions[bot]" ] \
            && [ "$(git log -1 --format=%s "$CI_HEAD_SHA")" = "CI: publish signed Lightweaver firmware release" ]; then
            export CI_GENERATED_RELEASE=true
          fi
          # Studio-only changes whose card-embedded bundle provably did not
          # change skip the firmware lane (and its VERSION-bump demand). The
          # check is fail-closed: anything short of a byte-level match prints
          # "false" and classification behaves exactly as before.
          CI_CARD_BUNDLE_UNCHANGED="$(node scripts/ci-card-bundle-check.mjs --print)"
          export CI_CARD_BUNDLE_UNCHANGED
          node scripts/ci-changed-lanes.mjs

  source:
    needs: classify
    if: needs.classify.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            lightweaver/package-lock.json
            led-art-mapper/app/package-lock.json
      - name: Install pinned source dependencies
        run: |
          npm ci --prefix lightweaver
          node lightweaver/scripts/ensure-rollup-native.mjs
          npm ci --prefix led-art-mapper/app
          npx --prefix lightweaver playwright install --with-deps chromium
      - name: Apply D1 migrations to isolated local CI state
        working-directory: lightweaver
        run: npm exec -- wrangler d1 migrations apply PROJECTS_DB --config wrangler.local.toml --local --persist-to .wrangler/ci-state
      - name: Run bounded source and build gate
        working-directory: lightweaver
        run: npm run ci:source-build

  browser:
    needs: classify
    if: needs.classify.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: browser smoke
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the build number is the total commit count, and a
          # shallow clone would silently publish "build 1".
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lightweaver/package-lock.json
      - run: npm ci
        working-directory: lightweaver
      - run: node scripts/ensure-rollup-native.mjs
        working-directory: lightweaver
      - name: Run zone-identity and card-section node specs
        working-directory: lightweaver
        run: npm run ci:pr-lane-node-specs
      - run: npx playwright install --with-deps chromium
        working-directory: lightweaver
      - name: Run focused critical-workflow smoke tests
        working-directory: lightweaver
        run: |
          npm run ci:browser-smoke
          npm run test:windowless:browser
          npm run test:firmware-update:browser

  cloud:
    needs: classify
    if: needs.classify.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the build number is the total commit count, and a
          # shallow clone would silently publish "build 1".
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lightweaver/package-lock.json
      - run: npm ci
        working-directory: lightweaver
      - run: node scripts/ensure-rollup-native.mjs
        working-directory: lightweaver
      - run: npx playwright install --with-deps chromium
        working-directory: lightweaver
      - run: npm run ci:cloud
        working-directory: lightweaver

  production:
    needs: classify
    if: needs.classify.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the build number is the total commit count, and a
          # shallow clone would silently publish "build 1".
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lightweaver/package-lock.json
      - run: npm ci
        working-directory: lightweaver
      - run: node scripts/ensure-rollup-native.mjs
        working-directory: lightweaver
      - run: npx playwright install --with-deps chromium
        working-directory: lightweaver
      - run: npm run ci:production
        working-directory: lightweaver

  firmware:
    needs: classify
    if: needs.classify.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lightweaver/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/lightweaver-controller/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: |
          pip install platformio==6.1.19
          npm ci --prefix lightweaver
      - run: npm run ci:firmware-sensitive
        working-directory: lightweaver
      - run: node --test scripts/firmware-update-release.test.mjs
      # The signer refuses a release whose VERSION is not greater than the one
      # already signed, and a firmware-sensitive revision cannot reach the live
      # site by any other route. Until this check existed the refusal happened
      # AFTER merge: the PR went green, main landed, the signer went red on its
      # own workflow, Deploy site deferred to a signer that would never publish,
      # and the site kept serving the previous build. Three changes shipped days
      # late that way. Ask for the bump in the exact-source gate, before the
      # protected signer starts, where the correction is one follow-up on main.
      #
      # The predecessor is read from the committed manifest, not the live site:
      # the signer commits it in the same job that publishes, so the two always
      # agree, and the exact-source gate must not depend on the network being up.
      #
      # Only when a release will actually be built. build-firmware.yml skips the
      # signer outright when the firmware lane fired solely because Studio source
      # is embedded in the card bundle, so demanding a bump on those revisions
      # asks for a version no signer will ever consume — and #156 paid it,
      # bumping to 1.1.26 "for the signed release CI requires" on a Studio-only
      # change. Same condition as the signer, so the two can never disagree.
      - name: Require a firmware version the signer will be able to publish
        if: needs.classify.outputs.firmware_bundle_only != 'true'
        run: |
          previous="$(node -p 'require("./lightweaver/public/firmware/release-manifest.json").firmwareVersion')"
          current="$(tr -d '\r\n' < firmware/lightweaver-controller/VERSION)"
          if ! npm run --silent firmware:version:check --prefix lightweaver -- --previous "$previous" >/dev/null; then
            echo "::error file=firmware/lightweaver-controller/VERSION::This change is firmware-sensitive, so it can only reach led.mandalacodes.com through the protected signer — and the signer will refuse version $current because $previous is already signed. Bump firmware/lightweaver-controller/VERSION (and the literal in firmware/lightweaver-controller/tests/firmware-version-policy.mjs, which pins it), then rerun the exact main gate."
            exit 1
          fi
          echo "Firmware version $current is publishable over signed $previous."
      - name: Resolve the release build number
        id: buildnumber
        run: echo "value=$(git rev-list --count "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Compile pinned firmware with exact source identity
        env:
          LW_BUILD_ID: ${{ github.sha }}
          LW_BUILD_NUMBER: ${{ steps.buildnumber.outputs.value }}
        run: |
          npm run build:card --prefix lightweaver
          pio run -d firmware/lightweaver-controller -e esp32-s3-n16r8
          node firmware/lightweaver-controller/tests/saved-network-storage-native.mjs
          node firmware/lightweaver-controller/tests/card-identity-capabilities.mjs
          node firmware/lightweaver-controller/tests/windowless-card-studio.mjs

  artifact:
    needs: classify
    if: needs.classify.outputs.artifact == 'true' && needs.classify.outputs.firmware != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lightweaver/package-lock.json
      - run: npm ci
        working-directory: lightweaver
      - run: npm run ci:artifact
        working-directory: lightweaver
      # A signed release changes only the served manifest, so this lane is the
      # only gate a manifest-shaped break reaches. Kept as a separate step
      # rather than folded into ci:artifact: the signer runs that script
      # immediately before pushing to main, and it must stay browser-free.
      - run: node scripts/ensure-rollup-native.mjs
        working-directory: lightweaver
      - run: npx playwright install --with-deps chromium
        working-directory: lightweaver
      - run: npm run ci:artifact:release-ui
        working-directory: lightweaver
