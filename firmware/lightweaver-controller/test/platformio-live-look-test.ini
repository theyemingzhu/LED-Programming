# Native test env for test_live_look, kept as a SEPARATE project-conf file
# rather than an addition to the real platformio.ini.
#
# Why: [env:native] in platformio.ini is hard-pinned to
# `test_filter = test_recipe` and `build_src_filter = -<*> +<LightweaverRecipe.cpp>`
# — it cannot run a second, differently-scoped native suite without editing
# platformio.ini itself, which is out of scope for this change (owned by the
# CI/docs agent per the repo's agent ownership boundaries in CLAUDE.md).
# `pio test` has no per-invocation way to override test_filter/build_src_filter
# from the command line (`-O`/`--project-option` does not exist for `pio test`),
# but it does accept `-c/--project-conf` to point at a wholly different ini
# file for one run — that is what this file is for.
#
# The live-look codec (LiveLookRecord + encode/decode/match, all in
# LightweaverStorage.h) is Arduino/Preferences/SD-free and implemented
# entirely as inline functions in that header — mirroring how LightweaverRecipe
# keeps its native model free of Arduino.h so LW_STORAGE_NATIVE_TEST only has
# to hide the REST of the header (the NVS-facing declarations, guarded behind
# `#ifndef LW_STORAGE_NATIVE_TEST` there) rather than needing any project
# source file compiled at all — hence the empty build_src_filter below.
#
# Run:
#   pio test -d firmware/lightweaver-controller \
#     -c firmware/lightweaver-controller/test/platformio-live-look-test.ini \
#     -e native_live_look

[env:native_live_look]
platform = native
test_framework = unity
test_filter = test_live_look
test_build_src = true
build_src_filter =
  -<*>
build_flags =
  -DLW_STORAGE_NATIVE_TEST
  -I../src
lib_deps =
  bblanchon/ArduinoJson@7.4.3
