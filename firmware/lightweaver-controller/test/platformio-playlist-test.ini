# Native test env for test_playlist, kept as a SEPARATE project-conf file
# rather than an addition to the real platformio.ini — same reasoning as
# test/platformio-live-look-test.ini (see that file's header comment): the
# real [env:native] is hard-pinned to test_recipe / LightweaverRecipe.cpp and
# platformio.ini is owned by the CI/docs agent, out of scope for this change.
#
# The playlist codec (PlaylistRecord + decode/encode, all in
# LightweaverStorage.h, right below LiveLookRecord) is Arduino/Preferences/SD
# -free and implemented entirely as inline functions in that header, so
# LW_STORAGE_NATIVE_TEST only has to hide the REST of the header (the
# NVS-facing declarations, guarded behind `#ifndef LW_STORAGE_NATIVE_TEST`
# there) — hence the empty build_src_filter below.
#
# Run:
#   pio test -d firmware/lightweaver-controller \
#     -c firmware/lightweaver-controller/test/platformio-playlist-test.ini \
#     -e native_playlist

[env:native_playlist]
platform = native
test_framework = unity
test_filter = test_playlist
test_build_src = true
build_src_filter =
  -<*>
build_flags =
  -DLW_STORAGE_NATIVE_TEST
  -I../src
lib_deps =
  bblanchon/ArduinoJson@7.4.3
